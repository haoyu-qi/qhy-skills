<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --page-width: 500px;
      --page-padding: 14px;
      --radius-xl: 26px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --brand-blue: #4b7bff;
      --brand-green: #31a36a;
      --brand-orange: #f29a38;
      --brand-red: #ee6b60;
      --brand-purple: #a06bff;

      --bg-page: #f5f7fb;
      --bg-shell: #ffffff;
      --bg-summary: #eef4ff;
      --bg-work: #eef9f2;
      --bg-plan: #fff5e9;
      --bg-issue: #f6eeff;
      --bg-risk: #fff0f0;
      --bg-mini: rgba(255,255,255,0.78);

      --text-main: #273142;
      --text-sub: #5e6a7d;
      --text-light: #8e98a8;
      --line-soft: rgba(39,49,66,0.08);
      --shadow: 0 12px 32px rgba(39,49,66,0.06);
      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #f7f9fc 0%, var(--bg-page) 100%);
      color: var(--text-main);
      font-family: var(--font-sans);
    }

    body {
      padding: 16px 10px 28px;
    }

    .report-shell {
      max-width: var(--page-width);
      margin: 0 auto;
      background: var(--bg-shell);
      border-radius: var(--radius-xl);
      padding: 18px 14px 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.9);
    }

    .report-header {
      text-align: center;
      padding: 4px 8px 6px;
    }

    .report-header h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .report-header .period {
      margin-top: 6px;
      color: var(--text-light);
      font-size: 12px;
      line-height: 1.5;
    }

    .tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(75,123,255,0.10);
      color: var(--brand-blue);
      font-size: 11px;
      font-weight: 600;
    }

    .section-card {
      margin-top: 14px;
      padding: 16px 14px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--line-soft);
    }

    .summary-card { background: var(--bg-summary); }
    .work-card { background: var(--bg-work); }
    .plan-card { background: var(--bg-plan); }
    .issue-card { background: var(--bg-issue); }
    .risk-card { background: var(--bg-risk); }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .section-card p,
    .section-card blockquote,
    .section-card li {
      font-size: 14px;
      line-height: 1.75;
    }

    .section-card p,
    .section-card ul,
    .section-card blockquote {
      margin: 0;
    }

    .bullet-list {
      padding-left: 18px;
      color: var(--text-main);
    }

    .bullet-list li + li {
      margin-top: 6px;
    }

    blockquote {
      margin-top: 10px;
      padding-left: 10px;
      border-left: 3px solid rgba(75,123,255,0.45);
      color: var(--brand-blue);
      font-weight: 600;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .mini-card {
      padding: 10px 10px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-mini);
      border: 1px solid rgba(255,255,255,0.64);
    }

    .mini-card h3,
    .plan-group h3 {
      margin: 0 0 6px;
      font-size: 13px;
      line-height: 1.45;
    }

    .mini-card p,
    .plan-group p {
      font-size: 12px;
      line-height: 1.65;
      color: var(--text-sub);
    }

    .plan-group + .plan-group {
      margin-top: 10px;
    }

    .report-footer {
      text-align: center;
      margin-top: 16px;
      color: var(--text-light);
      font-size: 11px;
      line-height: 1.5;
    }

    {{CUSTOM_CSS}}

    @media (max-width: 768px) {
      body { padding: 10px 8px 22px; }
      .report-shell { border-radius: 22px; }
      .report-header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="report-shell">
    {{CONTENT_HTML}}
  </main>
</body>
</html>
