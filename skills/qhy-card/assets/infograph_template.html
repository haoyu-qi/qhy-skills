<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg-page: #f5f2ea;
      --bg-panel: rgba(255, 255, 255, 0.76);
      --ink: #1f2521;
      --muted: #5e675f;
      --line: rgba(31, 37, 33, 0.12);
      --accent: #3d7a57;
      --accent-soft: rgba(61, 122, 87, 0.12);
      --shadow: 0 24px 60px rgba(49, 62, 53, 0.10);
      --radius: 24px;
      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", serif;
      --font-mono: "SFMono-Regular", "Menlo", monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: radial-gradient(circle at top left, #fff9ee, var(--bg-page) 58%); color: var(--ink); }
    body { font-family: var(--font-sans); }

    .page {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 16px;
      background:
        linear-gradient(rgba(31, 37, 33, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 37, 33, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.28;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent 85%);
    }

    .frame {
      position: relative;
      z-index: 1;
      border: 1px solid var(--line);
      background: var(--bg-panel);
      box-shadow: var(--shadow);
      border-radius: 32px;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    {{CUSTOM_CSS}}
  </style>
</head>
<body>
  <main class="page">
    <section class="frame">
      {{CONTENT_HTML}}
    </section>
  </main>
</body>
</html>
