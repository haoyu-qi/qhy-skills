<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[必填] 替换为 PPT 标题 · Avcon Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --avcon-red:#c90012;
    --avcon-red-dark:#8f0005;
    --avcon-red-soft:#f0446f;
    --avcon-gray:#696969;
    --avcon-text:#333333;
    --avcon-line:#d3524f;
    --paper:#ffffff;
    --footer:#2f2f2f;
    --sans:"Noto Sans SC","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#fff;color:var(--avcon-text);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #deck{position:fixed;inset:0;width:10000vw;height:100vh;display:flex;transition:transform .65s cubic-bezier(.77,0,.175,1);will-change:transform}
  .slide{position:relative;width:100vw;height:100vh;flex:0 0 100vw;overflow:hidden;background:var(--paper);padding:5.8vh 6.2vw 5.2vh}

  /* Common */
  .avcon-logo{
    width:8.9vw;
    min-width:112px;
    height:auto;
    display:block;
    color:var(--avcon-red);
    object-fit:contain;
  }
  .footer{
    position:absolute;
    left:6.1vw;
    right:6.1vw;
    bottom:4.6vh;
    display:grid;
    grid-template-columns:56px 1fr auto;
    align-items:end;
    gap:1.6vw;
    font-size:max(13px,1vw);
    color:var(--footer);
    z-index:4;
  }
  .footer .page{font-weight:600}
  .footer .note{font-weight:600}
  .footer .avcon-logo{justify-self:end}

  /* Cover */
  .cover{padding:16.8vh 6.2vw 5.8vh}
  .cover-title{
    position:relative;
    z-index:2;
    font-size:7.3vw;
    line-height:1.08;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--avcon-gray);
    white-space:nowrap;
  }
  .cover-subtitle{
    position:relative;
    z-index:2;
    margin-top:2.3vh;
    font-size:3.15vw;
    line-height:1.2;
    font-weight:400;
    letter-spacing:.01em;
    color:var(--avcon-gray);
  }
  .cover-rule{
    position:relative;
    z-index:2;
    width:70vw;
    height:4px;
    margin-top:14vh;
    background:linear-gradient(90deg,#676767 0 9%,#9a9a9a 9% 100%);
    border-radius:999px;
  }
  .cover-rule::before{
    content:"";
    display:block;
    width:7.2vw;
    height:100%;
    background:#676767;
    border-radius:999px;
  }
  .presenter{
    position:relative;
    z-index:2;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:15.8vh;
    margin-left:.55vw;
    min-width:19.2vw;
    height:5.4vh;
    padding:0 3vw;
    color:#fff;
    font-size:1.62vw;
    font-weight:500;
    letter-spacing:.04em;
    background:linear-gradient(180deg,#ff9a9a 0%,#a30003 38%,#7d0000 100%);
  }
  .ring{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }
  .ring::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 48%,rgba(255,255,255,.92) 0 15%,rgba(255,255,255,0) 28%),
      conic-gradient(from 230deg,rgba(255,255,255,.96) 0 10%,rgba(246,0,55,.1) 10% 29%,rgba(246,0,55,.28) 29% 46%,rgba(246,0,55,.86) 46% 74%,rgba(255,178,196,.68) 74% 100%);
    mask:radial-gradient(circle,transparent 0 47%,#000 47.3% 100%);
    -webkit-mask:radial-gradient(circle,transparent 0 47%,#000 47.3% 100%);
  }
  .ring-right{
    width:72vw;
    height:72vw;
    right:-19vw;
    bottom:-34vw;
    opacity:.92;
  }
  .ring-left{
    width:24vw;
    height:24vw;
    left:-11vw;
    bottom:-12vw;
    opacity:.86;
  }

  /* Agenda/content page */
  .content-title{
    font-size:2.55vw;
    line-height:1.18;
    font-weight:800;
    color:#8a0000;
    letter-spacing:.02em;
  }
  .top-rule{
    position:absolute;
    left:0;
    right:0;
    top:13.1vh;
    height:8px;
    background:var(--avcon-line);
  }
  .content-body{
    position:absolute;
    left:6.2vw;
    right:6.2vw;
    top:18vh;
    bottom:12vh;
    display:grid;
    align-content:start;
    gap:2.4vh;
    color:var(--avcon-text);
  }
  .content-body.two-col{grid-template-columns:1fr 1fr;gap:4vw}
  .content-body .placeholder{
    min-height:48vh;
    border:1px dashed rgba(201,0,18,.18);
    color:rgba(51,51,51,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2vw;
    letter-spacing:.12em;
  }

  /* Thank-you page */
  .thanks{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-bottom:10vh;
  }
  .thanks::before{
    content:"";
    position:absolute;
    inset:-12vh -2vw 0 -2vw;
    background:
      radial-gradient(circle at 58% 38%,rgba(255,255,255,.18) 0 12%,transparent 12.2%),
      radial-gradient(circle at 52% 46%,transparent 0 28%,rgba(246,0,55,.075) 28.2% 28.9%,transparent 29.1%),
      radial-gradient(circle at 52% 46%,transparent 0 36%,rgba(246,0,55,.06) 36.2% 36.9%,transparent 37.1%),
      radial-gradient(circle at center,rgba(246,0,55,.075) 1.6px,transparent 1.8px);
    background-size:auto,auto,auto,12px 12px;
    opacity:.9;
    z-index:0;
    mask:radial-gradient(ellipse at center,#000 0 58%,transparent 72%);
    -webkit-mask:radial-gradient(ellipse at center,#000 0 58%,transparent 72%);
  }
  .thanks-inner{position:relative;z-index:2}
  .thanks-title{
    color:var(--avcon-gray);
    font-size:6.55vw;
    line-height:1.52;
    font-weight:500;
    letter-spacing:.03em;
  }
  .thanks-sub{
    display:grid;
    grid-template-columns:24vw auto 24vw;
    gap:1.7vw;
    align-items:center;
    justify-content:center;
    margin-top:6vh;
    color:var(--avcon-gray);
    font-size:3.6vw;
    line-height:1;
    font-weight:500;
  }
  .thanks-sub::before,.thanks-sub::after{
    content:"";
    height:3px;
    background:linear-gradient(90deg,rgba(143,0,5,0),var(--avcon-red-dark));
  }
  .thanks-sub::after{background:linear-gradient(90deg,var(--avcon-red-dark),rgba(143,0,5,0))}

  #nav{
    position:fixed;
    left:50%;
    bottom:2.1vh;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    gap:8px;
    opacity:.22;
    transition:opacity .2s ease;
  }
  #nav:hover{opacity:.8}
  #nav button{width:7px;height:7px;border:0;border-radius:50%;background:#777;opacity:.45;cursor:pointer}
  #nav button.active{width:22px;border-radius:999px;background:var(--avcon-red);opacity:.95}
  #hint{position:fixed;right:2vw;bottom:2vh;z-index:10;font-size:10px;color:#777;opacity:.35;letter-spacing:.16em}

  @media (max-width:900px){
    .cover-title{font-size:10vw;white-space:normal}
    .cover-subtitle{font-size:5.2vw}
    .presenter{font-size:3.2vw;min-width:38vw}
    .content-title{font-size:5.6vw}
    .footer{grid-template-columns:36px 1fr auto;font-size:12px}
    .footer .avcon-logo{width:22vw;min-width:96px}
    .thanks-title{font-size:11vw}
    .thanks-sub{font-size:6.5vw;grid-template-columns:22vw auto 22vw}
  }
</style>
</head>

<nav id="nav" aria-label="Slides"></nav>
<div id="hint">← → 翻页</div>
<script>
const deck=document.getElementById('deck');
const slides=[...document.querySelectorAll('.slide')];
const nav=document.getElementById('nav');
let idx=0;
deck.style.width=(slides.length*100)+'vw';
slides.forEach((_,i)=>{
  const b=document.createElement('button');
  b.type='button';
  b.setAttribute('aria-label','Page '+(i+1));
  b.onclick=()=>go(i);
  nav.appendChild(b);
});
function go(n){
  idx=Math.max(0,Math.min(slides.length-1,n));
  deck.style.transform=`translateX(${-idx*100}vw)`;
  nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===idx));
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight' || e.key===' ') go(idx+1);
  if(e.key==='ArrowLeft') go(idx-1);
});
let sx=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>60) go(idx+(dx<0?1:-1));
},{passive:true});
go(0);
</script>
