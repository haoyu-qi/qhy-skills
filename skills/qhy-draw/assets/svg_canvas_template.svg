<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">qhy-draw SVG Template</title>
  <desc id="desc">A reusable SVG canvas template for architecture, flow, and system diagrams.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <style>
      .title { font: 700 24px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 400 13px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .section { font: 700 13px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; letter-spacing: 0.04em; }
      .node-label { font: 600 14px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .meta-label { font: 400 12px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .legend-label { font: 400 12px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect width="960" height="600" fill="#f8fafc" />

  <text x="48" y="48" class="title">Diagram Title</text>
  <text x="48" y="72" class="subtitle">Replace this subtitle with the key question the diagram answers.</text>

  <rect x="48" y="110" width="260" height="360" rx="20" fill="#ffffff" stroke="#dbe3ef" />
  <text x="68" y="140" class="section">SECTION A</text>
  <rect x="68" y="170" width="220" height="72" rx="16" fill="#eff6ff" stroke="#93c5fd" />
  <text x="96" y="212" class="node-label">Primary Node</text>
  <text x="96" y="232" class="meta-label">Short explanation</text>

  <rect x="350" y="110" width="260" height="360" rx="20" fill="#ffffff" stroke="#dbe3ef" />
  <text x="370" y="140" class="section">SECTION B</text>
  <rect x="370" y="170" width="220" height="72" rx="16" fill="#ecfeff" stroke="#67e8f9" />
  <text x="398" y="212" class="node-label">Secondary Node</text>
  <text x="398" y="232" class="meta-label">Another short label</text>

  <rect x="652" y="110" width="260" height="360" rx="20" fill="#ffffff" stroke="#dbe3ef" />
  <text x="672" y="140" class="section">SECTION C</text>
  <rect x="672" y="170" width="220" height="72" rx="16" fill="#f0fdf4" stroke="#86efac" />
  <text x="700" y="212" class="node-label">Output Node</text>
  <text x="700" y="232" class="meta-label">Final result or sink</text>

  <path d="M 288 206 L 370 206" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="302" y="186" width="54" height="20" rx="10" fill="#ffffff" stroke="#dbe3ef" />
  <text x="314" y="200" class="legend-label">data</text>

  <path d="M 590 206 L 672 206" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)" />
  <rect x="606" y="186" width="50" height="20" rx="10" fill="#ffffff" stroke="#dbe3ef" />
  <text x="616" y="200" class="legend-label">write</text>

  <rect x="700" y="500" width="212" height="60" rx="16" fill="#ffffff" stroke="#dbe3ef" />
  <text x="718" y="525" class="section">LEGEND</text>
  <line x1="718" y1="544" x2="756" y2="544" stroke="#2563eb" stroke-width="2.5" />
  <text x="766" y="548" class="legend-label">Primary flow</text>
  <line x1="718" y1="564" x2="756" y2="564" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" />
  <text x="766" y="568" class="legend-label">Write / async flow</text>
</svg>
